# Configurações do instalador. Mude aqui antes de rodar ./instalar.sh
# (1 = sim, 0 = não)

# --- Teclado (MacBook com layout americano) ---
# "altgr-intl": o teclado continua americano normal e os acentos ficam
# na tecla Option DIREITA (AltGr). Ex.: Option direito + ' depois a = á;
# Option direito + , = ç. Aspas e acentos NÃO "travam" ao programar.
# Alternativa: TECLADO_VARIANTE="intl" (teclas mortas, igual ao Windows US-Internacional).
TECLADO_LAYOUT="us"
TECLADO_VARIANTE="altgr-intl"

# Command (⌘) funciona como Ctrl (⌘C copia, ⌘V cola, ⌘Q fecha, ⌘Tab troca de janela).
# O Ctrl físico continua sendo Ctrl (Ctrl+C no terminal interrompe programas).
CMD_COMO_CTRL=1

# --- Memória ---
# Porcentagem da RAM usada como swap comprimido (zram). 60% de 4 GB ≈ 2,4 GB.
ZRAM_PORCENTAGEM=60

# --- Programas ---
FIREFOX_DEB=1             # troca o Firefox Snap pela versão .deb oficial da Mozilla (abre mais rápido)
INSTALAR_CLAUDE_DESKTOP=1
INSTALAR_CLAUDE_CODE=1    # Claude Code no terminal (comando "claude")
INSTALAR_COWORK=0         # Cowork roda uma máquina virtual: pesado demais para 4 GB de RAM

# --- Aparência ---
TEMA_MAC=1                # dock embaixo, botões das janelas à esquerda, tema e fontes

# --- Sistema ---
FUSO_HORARIO="America/Sao_Paulo"
