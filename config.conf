# Configurações do instalador. Mude aqui antes de rodar ./instalar.sh
# (1 = sim, 0 = não)

# --- Teclado (MacBook com teclado americano) ---
# "mac" = layout "English (Macintosh)": acentos exatamente como no macOS
#   ⌥e a = á   ⌥n a = ã   ⌥i e = ê   ⌥` a = à   ⌥u u = ü   ⌥c = ç
# Alternativas: "altgr-intl" (acentos direto: ⌥e = é) ou "intl" (teclas mortas no ' e ").
TECLADO_LAYOUT="us"
TECLADO_VARIANTE="mac"

# ⌘ funciona como no Mac (⌘C copia, ⌘Q fecha, ⌘Tab troca de app...). Ver arquivos/keyd-mac.conf.
CMD_COMO_CTRL=1

# ⌥ esquerdo: "mac" = digita acentos e símbolos como o ⌥ do Mac (o direito sempre faz isso);
#             "alt" = vira a tecla Alt do Linux (útil para atalhos Alt+letra no terminal).
# Nos dois casos ⌥← ⌥→ ⌥⌫ andam/apagam por palavra e ⌥Tab, ⌥F4, ⌥Enter continuam Alt.
OPTION_ESQUERDO="mac"

# --- Memória ---
# Porcentagem da RAM usada como swap comprimido (zram). 60% de 4 GB ≈ 2,4 GB.
ZRAM_PORCENTAGEM=60

# --- Programas ---
FIREFOX_DEB=1             # troca o Firefox Snap pela versão .deb oficial da Mozilla (abre mais rápido)
INSTALAR_CHROME=1         # Google Chrome, necessário para o Claude in Chrome (Claude usando o navegador)
INSTALAR_CLAUDE_DESKTOP=1
INSTALAR_CLAUDE_CODE=1    # Claude Code no terminal (comando "claude")
INSTALAR_COWORK=0         # Cowork roda uma máquina virtual: pesado demais para 4 GB de RAM

# --- Aparência ---
TEMA_MAC=1                # dock embaixo, botões das janelas à esquerda, tema e fontes

# --- Sistema ---
FUSO_HORARIO="America/Sao_Paulo"
