# Gerado pelo Ubuntu-Mac — MacBook Air 7,1 — 11" Early 2015, i5-5250U
# Referência: https://linrunner.de/tlp/settings/

TLP_DEFAULT_MODE=AC

CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
# Turbo ligado também na bateria: num processador de 2 núcleos a 1,6 GHz,
# desligar o turbo deixa tudo visivelmente mais lento.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1

PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

# O driver wl do Broadcom fica instável com economia de energia ligada.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off

# No MacBook Air o teclado, o touchpad e o Bluetooth internos são USB.
# Suspender USB economiza muito pouco e pode fazer o touchpad "engasgar";
# também derrubaria a internet do celular via cabo.
USB_AUTOSUSPEND=0

RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
