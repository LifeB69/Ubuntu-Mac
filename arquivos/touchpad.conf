# Gerado pelo Ubuntu-Mac — touchpad do MacBook no estilo macOS
Section "InputClass"
    Identifier      "ubuntu-mac touchpad"
    MatchIsTouchpad "on"
    MatchDriver     "libinput"
    Driver          "libinput"
    # rolagem "natural" (conteúdo segue os dedos, como no Mac)
    Option "NaturalScrolling"   "true"
    Option "ScrollMethod"       "twofinger"
    # toque leve = clique
    Option "Tapping"            "on"
    Option "TappingDrag"        "on"
    # clique com 1 dedo = esquerdo; 2 dedos = direito; 3 dedos = meio
    Option "ClickMethod"        "clickfinger"
    # ignora a palma da mão enquanto digita
    Option "DisableWhileTyping" "true"
    Option "AccelProfile"       "adaptive"
    Option "AccelSpeed"         "0.3"
EndSection
