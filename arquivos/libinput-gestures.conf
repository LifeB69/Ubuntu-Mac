# Gerado pelo Ubuntu-Mac — gestos do touchpad do MacBook.
# Depois de editar:  libinput-gestures-setup restart
# Documentação: https://github.com/bulletmark/libinput-gestures

# 3 dedos para os lados: troca de área de trabalho (como trocar de tela no Mac)
gesture swipe left  3 xdotool key ctrl+alt+Right
gesture swipe right 3 xdotool key ctrl+alt+Left

# 3 dedos para cima: todas as janelas (parecido com o Mission Control)
gesture swipe up    3 xfdashboard --toggle
# 3 dedos para baixo: mostrar a área de trabalho
gesture swipe down  3 xdotool key super+d

# 4 dedos para os lados: voltar / avançar (navegador, arquivos)
gesture swipe left  4 xdotool key alt+Right
gesture swipe right 4 xdotool key alt+Left

# Pinça: zoom
gesture pinch in    ubuntu-mac-zoom out
gesture pinch out   ubuntu-mac-zoom in
