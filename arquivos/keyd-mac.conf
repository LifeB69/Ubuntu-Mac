# Gerado pelo Ubuntu-Mac — teclado do MacBook com comportamento de Mac.
# Documentação: man keyd
#
#  ⌘ (Command) + tecla   → Ctrl + tecla   (⌘C, ⌘V, ⌘X, ⌘Z, ⌘A, ⌘S, ⌘Q, ⌘W, ⌘T...)
#  ⌘ sozinho (toque rápido) → abre o menu de aplicativos
#  ⌘ + Espaço             → abre o menu/busca de aplicativos (como o Spotlight)
#  ⌘ + Tab                → troca de janela (segure ⌘ e toque Tab várias vezes)
#  ⌘ + ← / →              → início / fim da linha
#  ⌘ + ↑ / ↓              → início / fim do documento
#  ⌘ + Backspace          → apaga até o início da linha
#  ⌘ + [ / ]              → voltar / avançar (navegador, arquivos)
#  Option + ← / →         → pula palavra (com Shift, seleciona)
#  Option + Backspace     → apaga a palavra anterior
#  Ctrl físico            → continua Ctrl (Ctrl+C no terminal interrompe o programa)
#  Option esquerdo        → Alt;  Option direito → AltGr (acentos: ver config.conf)
#
# No terminal, copiar/colar é ⌘+Shift+C / ⌘+Shift+V (padrão do Linux).

[ids]
*

[main]
leftmeta = overloadt2(cmd, leftmeta, 250)
rightmeta = overloadt2(cmd, rightmeta, 250)

[cmd:C]
tab = swapm(trocajanela, A-tab)
space = M-space
left = home
right = end
up = C-home
down = C-end
backspace = macro(S-home backspace)
leftbrace = A-left
rightbrace = A-right

[trocajanela:A]
tab = A-tab

# Option esquerdo (Alt) no estilo Mac. O Option direito é o AltGr (acentos) e não muda.
[alt]
left = C-left
right = C-right
backspace = C-backspace
