# Gerado pelo Ubuntu-Mac — teclado do MacBook Air com o comportamento do macOS.
# Documentação: man keyd.rvaiya   |   Testes: testes/keyd/ (simulador do próprio keyd)
#
# ⌘ (Command) funciona como o ⌘ do Mac:
#   ⌘C ⌘V ⌘X     copiar / colar / recortar — por Ctrl+Insert, Shift+Insert e
#                 Shift+Delete, que funcionam em todos os programas E no terminal
#                 (lá o Ctrl+C de verdade continua interrompendo o programa).
#   ⌘⇧V          colar sem formatação        ⌘Z ⌘⇧Z  desfazer / refazer
#   ⌘Q            fechar o app (Alt+F4)       ⌘H ⌘M   esconder (minimizar)
#   ⌘W ⌘T ⌘N ⌘S ⌘F ⌘A ⌘L ⌘R ⌘P   como no Mac (viram Ctrl+…)
#   ⌘Tab / ⌘⇧Tab  trocar de app (segure ⌘)   ⌘`      outra janela do mesmo app
#   ⌘Espaço       busca de apps (Spotlight)
#   ⌘← ⌘→ ⌘↑ ⌘↓  início/fim da linha / do documento (com ⇧, seleciona)
#   ⌘⌫            apaga até o início da linha
#   ⌘[ ⌘]         voltar / avançar            ⌘⇧[ ⌘⇧]  aba anterior / próxima
#   ⌘⇧.           mostrar arquivos ocultos (gerenciador de arquivos)
#   ⌘⇧3 ⌘⇧4 ⌘⇧5  captura: tela inteira / área / opções
#   ⌘F3           mostrar a área de trabalho
#   ⌘⌥I ⌘⌥J ⌘⌥C  ferramentas de desenvolvedor do navegador   ⌘⌥U  código-fonte
#   ⌘⌥F           localizar e substituir     ⌘⌥← ⌘⌥→  aba anterior / próxima
#   ⌥⌘Esc         forçar encerrar (clique na janela travada)
# ⌃ (Control):
#   ⌃C no terminal interrompe o programa (igual ao Mac)
#   ⌃← ⌃→        área de trabalho à esquerda/direita    ⌃↑  todas as janelas
#   ⌃⌘Q           bloquear a tela             ⌃⌘F     tela cheia
#   ⌃⌘Espaço      emojis (em apps GTK)
# ⌥ (Option):
#   ⌥← ⌥→ ⌥⌫     palavra anterior / próxima / apagar palavra (com ⇧, seleciona)
#   ⌥ + letras    acentos e símbolos do Mac (layout "English (Macintosh)"):
#                 ⌥e a = á   ⌥n a = ã   ⌥i e = ê   ⌥` a = à   ⌥u u = ü   ⌥c = ç
#                 O ⌥ direito sempre faz isso. O esquerdo também, se
#                 OPTION_ESQUERDO=mac no config.conf (padrão); com "alt" ele vira Alt.
# Teclas F (sem fn): brilho, F3 = todas as janelas, F4 = apps, luz do teclado,
# música e volume. Com fn: F1–F12. fn+← → ↑ ↓ = Home/End/PgUp/PgDn, fn+⌫ = Delete.

[ids]
*

[main]
leftmeta = layer(cmd)
rightmeta = layer(cmd)

[cmd:C]
c = C-insert
v = S-insert
x = S-delete
q = A-f4
h = A-f9
m = A-f9
tab = swapm(trocajanela, A-tab)
grave = M-tab
space = M-space
left = home
right = end
up = C-home
down = C-end
backspace = macro(S-home backspace)
leftbrace = A-left
rightbrace = A-right
scale = M-d

[trocajanela:A]
tab = A-tab
grave = A-S-tab
left = A-S-tab
right = A-tab

[trocajanela+shift]
tab = A-S-tab

[cmd+shift]
c = C-S-c
v = C-S-v
x = C-S-x
left = S-home
right = S-end
up = C-S-home
down = C-S-end
leftbrace = C-pageup
rightbrace = C-pagedown
dot = C-h

[cmd+alt]
esc = C-A-esc
i = C-S-i
j = C-S-j
c = C-S-c
u = C-u
f = C-h
left = C-pageup
right = C-pagedown

[control+cmd]
q = M-l
f = A-f11
space = C-dot

[control]
left = C-A-left
right = C-A-right
up = scale

[control+shift]
left = C-S-left
right = C-S-right
up = C-S-up

[alt]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[alt+shift]
left = C-S-left
right = C-S-right

[control+alt]
left = C-A-left
right = C-A-right
up = C-A-up
down = C-A-down
backspace = C-A-backspace
delete = C-A-delete

[altgr]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[altgr+shift]
left = C-S-left
right = C-S-right
