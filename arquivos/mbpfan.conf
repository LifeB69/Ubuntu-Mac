# Gerado pelo Ubuntu-Mac — controle da ventoinha do MacBook Air
# Liga a ventoinha um pouco mais cedo que o padrão: o i5-5250U reduz
# a velocidade (throttling) quando esquenta, então resfriar = mais desempenho.
# Velocidades mínima/máxima são lidas do próprio Mac (SMC).
[general]
low_temp = 55
high_temp = 65
max_temp = 80
polling_interval = 1
